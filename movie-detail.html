<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details — MovieHub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cinema: {
                            red: '#e50914',
                            darkRed: '#b8000b',
                            gold: '#f5c518',
                            dark: '#070709',
                            card: '#101015'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#070709] text-neutral-100 min-h-screen antialiased selection:bg-red-600 selection:text-white flex flex-col justify-between">

    <!-- Top Ambient Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-48 bg-gradient-to-b from-red-600/10 via-transparent to-transparent pointer-events-none -z-10"></div>

    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-12 py-6 sm:py-8 flex-1">
        
        <!-- Navigation Header -->
        <header class="flex items-center justify-between pb-6 sm:pb-8 border-b border-white/5 mb-8">
            <!-- Back to Hub Button -->
            <a href="index.html" class="inline-flex items-center gap-2.5 font-tech text-xs sm:text-sm font-semibold uppercase tracking-wider text-neutral-300 hover:text-white px-4 py-2.5 rounded-xl border border-white/10 bg-white/[0.04] hover:bg-white/10 hover:border-red-500/50 transition-all duration-200 group">
                <svg class="w-4 h-4 text-red-500 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Explore</span>
            </a>

            <!-- Brand Logo -->
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center shadow-[0_0_15px_rgba(229,9,20,0.5)]">
                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
                    </svg>
                </div>
                <span class="font-display text-xl font-extrabold tracking-tight text-white uppercase">
                    Movie<span class="ruby-gradient-text">Hub</span>
                </span>
            </a>

            <!-- Share Button -->
            <button id="shareBtn" type="button" class="inline-flex items-center gap-2 font-tech text-xs uppercase tracking-wider text-neutral-300 hover:text-white px-3.5 py-2 rounded-xl border border-white/10 bg-white/[0.03] hover:bg-white/10 transition-colors" title="Share movie link">
                <svg class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                </svg>
                <span class="hidden sm:inline">Share</span>
            </button>
        </header>

        <!-- Movie Details Card Container -->
        <div id="movie-detail" class="grid grid-cols-1 md:grid-cols-[300px_1fr] lg:grid-cols-[340px_1fr] gap-8 lg:gap-12 bg-neutral-950 border border-neutral-800/90 rounded-2xl p-6 sm:p-8 md:p-12 items-start transition-all duration-300">
            <!-- Loading Skeleton Placeholder -->
            <div class="w-full aspect-[2/3] skeleton rounded-xl md:row-span-2"></div>
            <div class="flex flex-col gap-6">
                <div class="h-10 skeleton rounded-lg w-3/4"></div>
                <div class="flex gap-2">
                    <div class="h-6 w-20 skeleton rounded-md"></div>
                    <div class="h-6 w-16 skeleton rounded-md"></div>
                    <div class="h-6 w-24 skeleton rounded-md"></div>
                </div>
                <div class="h-24 skeleton rounded-lg w-full"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="h-16 skeleton rounded-lg"></div>
                    <div class="h-16 skeleton rounded-lg"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Cinematic Footer -->
    <footer class="border-t border-white/5 bg-neutral-950/80 backdrop-blur-md py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-12 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="font-display font-bold text-white tracking-wide">MOVIE<span class="text-red-600">HUB</span></span>
                <!-- <span class="text-neutral-600 text-xs">•</span> -->
                <!-- <span class="font-tech text-xs text-neutral-400">Powered by OMDb API</span> -->
            </div>
            <a href="index.html" class="font-tech text-xs text-neutral-400 hover:text-white transition-colors">
                ← Return to Hub
            </a>
        </div>
    </footer>

    <!-- Toast Notification for Copy Link -->
    <div id="toastNotice" class="toast-notice">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>Link copied to clipboard!</span>
    </div>

    <script src="movie-details.js"></script>
</body>
</html>
